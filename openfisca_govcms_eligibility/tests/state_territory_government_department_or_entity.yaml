# Test files describe situations and their expected outcomes
# We can run this test on our command line using `openfisca test /app/openfisca-rules/openfisca_rules/tests/state_territory_government_department_or_entity.yaml`

- name: State Territory Government department or entity with no type is not eligible for GovCMS
  period: 2024-03-01
  input:
    organisation_type: australian_government_department_or_entity
  output:
    australian_government_department_or_entity_eligible: "not_eligible"
    govcms_eligible: "not_eligible"

- name: State Territory Government department or entity State or Territory agency is eligible for GovCMS
  period: 2024-03-01
  input:
    organisation_type: state_territory_government_department_or_entity
    state_territory_government_department_or_entity_type: state_or_territory_agency
  output:
    state_territory_government_department_or_entity_eligible: "eligible"
    govcms_eligible: "eligible"

- name: State Territory Government department or entity report to State or Territory Minister is eligible for GovCMS
  period: 2024-03-01
  input:
    organisation_type: state_territory_government_department_or_entity
    state_territory_government_department_or_entity_type: report_to_state_or_territory_minister
  output:
    state_territory_government_department_or_entity_eligible: "eligible"
    govcms_eligible: "eligible"

- name: State Territory Government department or entity State or Territory board is eligible for GovCMS
  period: 2024-03-01
  input:
    organisation_type: state_territory_government_department_or_entity
    state_territory_government_department_or_entity_type: state_or_territory_board
  output:
    state_territory_government_department_or_entity_eligible: "eligible"
    govcms_eligible: "eligible"

- name: State Territory Government department or entity receive funding from their State or Territory is maybe eligible for GovCMS
  period: 2024-03-01
  input:
    organisation_type: state_territory_government_department_or_entity
    state_territory_government_department_or_entity_type: receive_funding_from_their_state_or_territory
  output:
    state_territory_government_department_or_entity_eligible: "maybe"
    govcms_eligible: "maybe"

- name: State Territory Government department or entity based on legislation is maybe eligible for GovCMS
  period: 2024-03-01
  input:
    organisation_type: state_territory_government_department_or_entity
    state_territory_government_department_or_entity_type: based_on_legislation
  output:
    state_territory_government_department_or_entity_eligible: "maybe"
    govcms_eligible: "maybe"

- name: State Territory Government department or entity other or none of the above is maybe eligible for GovCMS
  period: 2024-03-01
  input:
    organisation_type: state_territory_government_department_or_entity
    state_territory_government_department_or_entity_type: other_or_none_of_the_above
  output:
    state_territory_government_department_or_entity_eligible: "maybe"
    govcms_eligible: "maybe"

- name: State Territory Government department or entity vector test covering all eligibility outcomes
  period: 2024-03-01
  input:
    organisation_type: [none, state_territory_government_department_or_entity, state_territory_government_department_or_entity, state_territory_government_department_or_entity, state_territory_government_department_or_entity, state_territory_government_department_or_entity, state_territory_government_department_or_entity, state_territory_government_department_or_entity]
    state_territory_government_department_or_entity_type: [none, none, state_or_territory_agency, report_to_state_or_territory_minister, state_or_territory_board, receive_funding_from_their_state_or_territory, based_on_legislation, other_or_none_of_the_above]
  output:
    state_territory_government_department_or_entity_eligible: [not_eligible, not_eligible, eligible, eligible, eligible, maybe, maybe, maybe]
    govcms_eligible: [not_eligible, not_eligible, eligible, eligible, eligible, maybe, maybe, maybe]
